[project]
name = "fbengine_physics"
version = "1.1.1"
type = "library"
license = "Apache-2.0"
description = "fbengine's physics, on Jolt: worlds of rigid bodies, joints, characters, and casts."
readme = "README.md"
repository = "https://github.com/hlpdev/fbengine"
keywords = ["engine", "game", "physics", "jolt", "3d"]
fb = ">=1.3.0"

# By its folder here, and published by the version, which the folder's has to be in.
[dependencies]
fbengine = { path = "../fbengine", version = "1.1" }

# fbengine_physics' own DLL, native/fbengine_physics, built for each target into native/<target>/,
# with Jolt in it.
[native]
fbengine_physics_native = { dynamic = "native/{target}/fbengine_physics_native" }
