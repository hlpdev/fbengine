[project]
name = "fbengine_video"
version = "1.1.0"
type = "library"
license = "Apache-2.0"
description = "fbengine's video: MPEG-1 decoded on a thread of its own into frames, with its sound."
readme = "README.md"
repository = "https://github.com/hlpdev/fbengine"
keywords = ["engine", "game", "video", "mpeg", "cutscene"]
fb = ">=1.3.0"

# Its frames go into fbengine's textures, and its sound through fbengine_audio. By their folders
# here, and published by the version, which each folder's has to be in.
[dependencies]
fbengine = { path = "../fbengine", version = "1.1" }
fbengine_audio = { path = "../fbengine_audio", version = "1.1" }

# fbengine_video's own DLL, native/fbengine_video, built for each target into native/<target>/,
# with pl_mpeg in it.
[native]
fbengine_video_native = { dynamic = "native/{target}/fbengine_video_native" }
