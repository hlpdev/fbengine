[project]
name = "fbengine_video"
version = "0.1.1"
type = "library"
license = "Apache-2.0"
description = "fbengine's video: MPEG-1 decoded on a thread of its own into frames, with its sound."
readme = "README.md"
repository = "https://github.com/hlpdev/fbengine"
keywords = ["engine", "game", "video", "mpeg", "cutscene"]

# Its frames go into fbengine's textures, and its sound through fbengine_audio. By path for now, as
# fbengine_audio's are.
[dependencies]
fbengine = { path = "../fbengine" }
fbengine_audio = { path = "../fbengine_audio" }

# fbengine_video's own DLL, native/fbengine_video, built for each target into native/<target>/,
# with pl_mpeg in it.
[native]
fbengine_video_native = { dynamic = "native/{target}/fbengine_video_native" }
