[project]
name = "fbengine_tools"
version = "1.0.0"
type = "library"
license = "Apache-2.0"
description = "fbengine's tools: the cooker, which makes a game's files into what its release loads fastest, in a pak."
readme = "README.md"
repository = "https://github.com/hlpdev/fbengine"
keywords = ["engine", "game", "assets", "cooker", "tools"]
fb = ">=1.2.3"

# By its folder here, and published by the version, which the folder's has to be in.
[dependencies]
fbengine = { path = "../fbengine", version = "1.0" }

# fbengine_tools' own DLL, native/fbengine_tools, built for each target into native/<target>/,
# with libktx's encoder and meshoptimizer in it.
[native]
fbengine_tools_native = { dynamic = "native/{target}/fbengine_tools_native" }
