name: Native

# Each target's DLLs, built as a release's are, Linux's in a manylinux_2_28 container (AlmaLinux 8),
# so they run on glibc 2.28 as the programs fb builds do. Each target's are an artifact,
# native-<target>, a tar of packages/*/native/<target>/, which CI's tests and publishing unpack
# into the packages.

on:
  workflow_call:

jobs:
  native:
    name: native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            shell: msys2 {0}
            configure: -G Ninja
          - target: linux-x64
            os: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            shell: bash
          - target: linux-arm64
            os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            shell: bash
          - target: macos-arm64
            os: macos-15
            shell: bash
          - target: macos-x64
            os: macos-15-intel
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build
        run: |
          cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release -DFBENGINE_BUILD_TESTS=OFF
          cmake --build build --parallel
          tar -cf native-${{ matrix.target }}.tar packages/*/native/${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-${{ matrix.target }}.tar
          if-no-files-found: error
