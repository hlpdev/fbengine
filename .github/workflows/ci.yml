name: CI

# Each target's DLLs (native.yml), then fb's release on a plain runner of each target, which runs
# the packages' tests and the examples on those DLLs.

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FB_VERSION: 1.2.2

jobs:
  native:
    uses: ./.github/workflows/native.yml

  test:
    name: test ${{ matrix.target }}
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.target }}

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      # SDL's offscreen video, so no test opens a window, as each test asks too. These runners have
      # no Vulkan, so the GPU's tests skip themselves; the gpu job runs them.
      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
          FBENGINE_NO_GPU: '1'
        run: |
          tar -xf native-${{ matrix.target }}.tar
          fb --version
          for package in packages/*/; do fb test "$package"; done
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/fbengine/project.toml)"
          output="$(fb --color never run examples/hello | tr -d '\r')"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | tail -n 1)" = "fbengine $version"
          # fbengine_audio's examples, on miniaudio's null backend, each with 120 s to end, as a
          # program ending with its audio started, or panicking, must at once: the example, its
          # output in $output, and its exit code in $status.
          example() {
            fb --color never run "examples/$1" > example.txt 2>&1 &
            pid=$!
            for second in $(seq 120); do kill -0 "$pid" 2> /dev/null || break; sleep 1; done
            if kill -0 "$pid" 2> /dev/null; then
              kill "$pid"
              cat example.txt
              echo "examples/$1 didn't end in 120 s"
              exit 1
            fi
            status=0
            wait "$pid" || status=$?
            output="$(tr -d '\r' < example.txt)"
            printf '%s\n' "$output"
          }
          example sound
          test "$status" = 0
          test "$(printf '%s\n' "$output" | tail -n 1)" = "played 0.25 seconds of tone.ogg"
          example audio_exit
          test "$status" = 0
          test "$(printf '%s\n' "$output" | tail -n 1)" = "ending with the audio started"
          example audio_panic
          test "$status" != 0
          grep -q "^panic: a mistake, with the audio started" <<< "$output"
          example audio_stress
          test "$status" = 0
          test "$(printf '%s\n' "$output" | tail -n 1)" = "within the budget"

  # The GPU tests, with no window, on a software Vulkan driver, which the system's loader is told
  # to use alone: lavapipe, from Mesa (MSYS2's UCRT64 on Windows, apt's on Linux), and MoltenVK on
  # macOS: the C++ tests, and the packages' and examples', which draw. Intel Macs aren't here: their
  # runners have no Metal for MoltenVK, and Homebrew's Mesa has no lavapipe, so an Intel Mac's are
  # run by hand. On Linux the packages' and examples' programs link native.yml's DLLs, as a
  # release's do: fb links for an older glibc than this runner's, which what's built here needs.
  gpu:
    name: gpu ${{ matrix.target }}
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            shell: msys2 {0}
          - target: linux-x64
            os: ubuntu-24.04
            shell: bash
          - target: linux-arm64
            os: ubuntu-24.04-arm
            shell: bash
          - target: macos-arm64
            os: macos-15
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: runner.os == 'Linux'
        with:
          name: native-${{ matrix.target }}

      - name: Install MinGW and the Vulkan loader
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-validation-layers

      # Windows' lavapipe is mesa-dist-win's MSVC build: MSYS2's, built with MinGW, corrupts its
      # heap freeing host-visible memory. The runner runs as an administrator, for whom the loader
      # ignores VK_DRIVER_FILES, so lavapipe goes in the registry, where it looks for drivers.
      - name: Install lavapipe (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: '*'
          MESA: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mesa.7z" "$MESA"
          echo "$MESA_SHA256  $RUNNER_TEMP/mesa.7z" | sha256sum -c
          7z x -y "-o$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" > /dev/null
          manifest="$(cygpath -w "$RUNNER_TEMP/mesa/x64/lvp_icd.x86_64.json")"
          test -f "$manifest"
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$manifest" /t REG_DWORD /d 0 /f
          # The validation layers, MSYS2's, found the same way, as the loader takes no layer path
          # from an administrator either.
          layer="$(find /ucrt64 -name VkLayer_khronos_validation.json | head -n 1)"
          test -n "$layer"
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\ExplicitLayers' /v "$(cygpath -w "$layer")" /t REG_DWORD /d 0 /f

      - name: Install lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          # SDL's headers, which configuring the project needs, as native.yml's has them.
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | paste -sd: -)" >> "$GITHUB_ENV"

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja vulkan-loader molten-vk vulkan-validationlayers
          echo "VK_ADD_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VULKAN_LIBRARIES=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      # macOS drops DYLD_ variables on the way into the shell, so they're given to ctest itself,
      # which finds the loader there for volk. Vulkan's validation layers check every test's GPU
      # work, which a test requires when FBE_GPU_VALIDATION is 1.
      - name: Build and test
        env:
          SDL_VIDEO_DRIVER: offscreen
          FBE_GPU_VALIDATION: '1'
        run: |
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          export VK_LOADER_DEBUG=error,warn
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          # Every target, so ctest finds every test it lists: the C++ tests, the packages', and the
          # examples'.
          cmake --build build --parallel
          if [ "$RUNNER_OS" = Linux ]; then tar -xf native-${{ matrix.target }}.tar; fi
          DYLD_FALLBACK_LIBRARY_PATH="${VULKAN_LIBRARIES:-}" ctest --test-dir build --output-on-failure || {
            if [ "$RUNNER_OS" = Windows ]; then
              pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gdb > /dev/null
              gdb -batch -ex run -ex bt -ex 'info sharedlibrary' build/tests/fbengine_gpu_tests.exe
            fi
            exit 1
          }

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      # The .clang-format's keys need clang-format 19, which the runner's apt doesn't have; this is
      # the version Visual Studio's is.
      - name: clang-format and fb fmt
        run: |
          pipx install clang-format==19.1.5
          git ls-files '*.h' '*.hpp' '*.c' '*.cpp' | xargs clang-format --dry-run -Werror
          fb fmt --check packages examples
          sh tools/bindgen.sh --check
