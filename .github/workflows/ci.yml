name: CI

# Each target's DLLs (native.yml), then fb's release on a plain runner of each target, which runs
# the packages' tests and the examples on those DLLs.

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FB_VERSION: 1.0.0

jobs:
  native:
    uses: ./.github/workflows/native.yml

  test:
    name: test ${{ matrix.target }}
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      - name: Test
        run: |
          tar -xf native-${{ matrix.target }}.tar
          fb --version
          fb test packages/fbengine
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/fbengine/project.toml)"
          output="$(fb --color never run examples/hello | tr -d '\r')"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | tail -n 1)" = "fbengine $version"

  # The GPU tests, with no window, on a software Vulkan driver, which the system's loader is told
  # to use alone: lavapipe, from Mesa (MSYS2's UCRT64 on Windows, apt's on Linux), and MoltenVK on
  # macOS. Intel Macs aren't here: their runners have no Metal for MoltenVK, and Homebrew's Mesa
  # has no lavapipe, so an Intel Mac's are run by hand.
  gpu:
    name: gpu ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            shell: msys2 {0}
          - target: linux-x64
            os: ubuntu-24.04
            shell: bash
          - target: linux-arm64
            os: ubuntu-24.04-arm
            shell: bash
          - target: macos-arm64
            os: macos-15
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # MINGW64's lavapipe corrupts its heap as the device is made; UCRT64's is the one MSYS2
      # keeps current.
      - name: Install MinGW and lavapipe
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-mesa

      # The runner runs as an administrator, for whom the loader ignores VK_DRIVER_FILES, so
      # lavapipe goes in the registry, where it looks for drivers.
      - name: Use lavapipe (Windows)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          manifest="$(cygpath -w /ucrt64/share/vulkan/icd.d/lvp_icd.x86_64.json)"
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$manifest" /t REG_DWORD /d 0 /f

      - name: Install lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan1 mesa-vulkan-drivers
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja vulkan-loader molten-vk
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VULKAN_LIBRARIES=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # macOS drops DYLD_ variables on the way into the shell, so they're given to ctest itself,
      # which finds the loader there for volk.
      - name: Build and test
        run: |
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          export VK_LOADER_DEBUG=error,warn
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFBENGINE_FB_TESTS=OFF
          cmake --build build --parallel
          DYLD_FALLBACK_LIBRARY_PATH="${VULKAN_LIBRARIES:-}" ctest --test-dir build --output-on-failure || {
            if [ "$RUNNER_OS" = Windows ]; then
              pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gdb > /dev/null
              gdb -batch -ex run -ex bt -ex 'info sharedlibrary' build/tests/fbengine_gpu_tests.exe
            fi
            exit 1
          }

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      # The .clang-format's keys need clang-format 19, which the runner's apt doesn't have; this is
      # the version Visual Studio's is.
      - name: clang-format and fb fmt
        run: |
          pipx install clang-format==19.1.5
          git ls-files '*.h' '*.hpp' '*.c' '*.cpp' | xargs clang-format --dry-run -Werror
          fb fmt --check packages examples
