name: Publish

# Publishes every library package, at the version their project.toml says, to a registry, through
# trusted publishing: each package trusts this workflow on the registry, so there's no stored token.
# It runs by hand, on the tag v<version>: `gh workflow run publish.yml --ref v0.1.0 -f
# registry=staging`. Each target's DLLs are built first (native.yml), into the packages' target
# archives; then fb's release adds each package from the registry, on each target, and runs it.
# fbengine_editor is a program, which the registry doesn't take: published to futureblitz, it's built
# for each target with its DLLs beside it and attached to the tag's GitHub release, which has to be
# made first.
# Published to futureblitz, it's posted last in the Discord server's releases channel, through the
# webhook DISCORD_RELEASES_WEBHOOK, pinging the role DISCORD_RELEASES_ROLE.

on:
  workflow_dispatch:
    inputs:
      registry:
        description: The registry to publish to
        type: choice
        options: [staging, futureblitz]
        default: staging

concurrency:
  group: publish
  cancel-in-progress: false

env:
  FB_VERSION: 1.2.3

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      index: ${{ steps.version.outputs.index }}
    steps:
      - uses: actions/checkout@v7

      # The tag is the version every package's project.toml says.
      - id: version
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/fbengine/project.toml)"
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::Publish runs on the tag v$version, not $GITHUB_REF"
            exit 1
          fi
          for toml in packages/*/project.toml; do
            if [ "$(sed -n 's/^version = "\(.*\)"$/\1/p' "$toml")" != "$version" ]; then
              echo "::error::$toml isn't version $version, as packages/fbengine's is"
              exit 1
            fi
          done
          case "$REGISTRY" in
            staging) index=https://staging-index.futureblitz.dev/ ;;
            futureblitz) index=futureblitz ;;
            *) echo "::error::There's no registry $REGISTRY"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "index=$index" >> "$GITHUB_OUTPUT"

  native:
    needs: version
    uses: ./.github/workflows/native.yml

  publish:
    name: publish
    needs: [version, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      - name: Publish
        env:
          INDEX: ${{ needs.version.outputs.index }}
          # A package's first version can't come by trusted publishing, which the registry takes only
          # for a package that exists: that one comes by a token scoped to these packages, set for
          # the day of the first release and removed after. Unset, trusted publishing alone is used.
          FB_REGISTRY_TOKEN: ${{ secrets.FB_REGISTRY_TOKEN }}
        run: |
          for archive in native-*.tar; do tar -xf "$archive"; done
          # Every package with a DLL has it for every target. native/common is no package's.
          for native in native/*/; do
            package="$(basename "$native")"
            [ -d "packages/$package" ] || continue
            for target in windows-x64 linux-x64 linux-arm64 macos-arm64 macos-x64; do
              if [ ! -d "packages/$package/native/$target" ]; then
                echo "::error::$package has no DLLs for $target"
                exit 1
              fi
            done
          done
          # In the order they depend on each other, as the registry refuses a dependency it hasn't
          # got: fbengine; then what needs only it; then fbengine_video, which needs fbengine_audio
          # too. A package's first version is published from the user's `fb login`, as trusted
          # publishing only publishes packages already on the registry that trust this workflow.
          for package in fbengine fbengine_audio fbengine_physics fbengine_ui fbengine_tools \
                         fbengine_video; do
            fb publish "packages/$package" --registry "$INDEX"
          done

  # The editor, built for each target as a release's programs are, with the DLLs it loads beside it
  # and the notices of what they bundle, packed, and attached to the tag's release: only for
  # futureblitz, once its packages are published, as staging's runs have no release to touch.
  editor:
    name: editor ${{ matrix.target }}
    needs: [version, native, publish]
    if: inputs.registry == 'futureblitz'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.target }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      - name: Build and attach
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xf "native-$TARGET.tar"
          if ! gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::There's no release v$VERSION to attach the editor to: make it first"
            exit 1
          fi
          # The program by its OS's name, its DLLs, and notices/: what fb build says it bundled, and
          # each DLL's package's. The archive's path is the last line.
          python tools/pack_editor.py fb "$VERSION" "$TARGET" "$RUNNER_TEMP/editor" | tee "$RUNNER_TEMP/packed"
          archive="$(tail -n 1 "$RUNNER_TEMP/packed")"
          gh release upload "v$VERSION" "$archive" --clobber -R "$GITHUB_REPOSITORY"

  check:
    name: check ${{ matrix.target }}
    needs: [version, publish]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
          - target: linux-x64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-fb
        with:
          version: ${{ env.FB_VERSION }}

      # A new game adds fbengine from the registry, as anyone would, and runs examples/hello's
      # program with it. The registry's index can take a moment to show the new version.
      - name: Add and run
        env:
          VERSION: ${{ needs.version.outputs.version }}
          INDEX: ${{ needs.version.outputs.index }}
        run: |
          fb new "$RUNNER_TEMP/game"
          cp examples/hello/main.fb "$RUNNER_TEMP/game/main.fb"
          cd "$RUNNER_TEMP/game"
          registry=futureblitz
          if [ "$INDEX" != futureblitz ]; then
            registry=published
            printf '\n[registries]\npublished = { index = "%s" }\n' "$INDEX" >> project.toml
          fi
          for attempt in 1 2 3 4 5 6; do
            if fb add "fbengine@$VERSION" --registry "$registry"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
          cat project.toml
          output="$(fb --color never run | tr -d '\r')"
          printf '%s\n' "$output"
          test "$(printf '%s\n' "$output" | tail -n 1)" = "fbengine $VERSION"

  # The release's notes, when the tag has a GitHub release, else the package's page. Only the
  # engine role is pinged.
  discord:
    name: discord
    needs: [version, check, editor]
    if: inputs.registry == 'futureblitz'
    runs-on: ubuntu-24.04
    steps:
      - name: Post it
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          ROLE: ${{ vars.DISCORD_RELEASES_ROLE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ] || [ -z "$ROLE" ]; then
            echo "::error::DISCORD_RELEASES_WEBHOOK or DISCORD_RELEASES_ROLE isn't set"
            exit 1
          fi
          link="https://pkg.futureblitz.dev/packages/fbengine"
          summary=""
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            link="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
            summary="$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json body -q .body \
              | awk 'NF { print; next } { exit }' | head -c 1200)"
          fi
          content="$(printf '<@&%s> **fbengine %s** is out.' "$ROLE" "$VERSION")"
          if [ -n "$summary" ]; then
            content="$(printf '%s\n\n%s' "$content" "$summary")"
          fi
          content="$(printf '%s\n\nRelease notes: <%s>' "$content" "$link")"
          jq -n --arg content "$content" --arg role "$ROLE" \
            '{ content: $content, allowed_mentions: { parse: [], roles: [$role] } }' \
            | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
